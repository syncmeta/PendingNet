name: PendingNet
options:
  bundleIdPrefix: com.pendingname
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 全端共用的版本号。macOS target 下面还会再写一遍同样的值 —— 发布脚本
    # 取的是 MARKETING_VERSION 的最后一次出现，两处要一起改。
    MARKETING_VERSION: "0.3.21"
    CURRENT_PROJECT_VERSION: "321"
    GENERATE_INFOPLIST_FILE: "YES"
packages:
  SBTallyCore:
    path: SBTallyCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2
targets:
  PendingNetPacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: PendingNet Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PendingNetPacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.pendingname.pendingnet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingnet.extension
        PRODUCT_NAME: PendingNetPacketTunnel
        # 仅 iOS target 使用自动签名；macOS 侧沿用既有的 Developer ID + 公证流程，不受影响。
        DEVELOPMENT_TEAM: M42BKJN82S
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SBTallyCore
        product: SBTallyCore
      - framework: Vendor/Libbox.xcframework
        embed: false
      # Libbox 是静态库，它自己的依赖要由宿主 target 补齐：
      # Go 运行时的 cgo resolver 引用 res_9_ninit/nclose/nsearch（libresolv），
      # 内嵌的 base::ios::ScopedCriticalAction 引用 UIApplication（UIKit）。
      - sdk: libresolv.tbd
      - sdk: UIKit.framework
  PendingNetIOS:
    type: application
    platform: iOS
    sources:
      - path: PendingNetIOS
      - path: PendingUI
      # 与 macOS 共用同一份分层图标（见 scripts/make-app-icon.py）
      - path: PendingNet.icon
    # 与 macOS 那份**逐字相同**的 .pdn 类型声明（见下面 PendingNet target）。
    # 少了它，系统根本不知道 PendingNet 认识这个后缀：「文件」里点开没反应，
    # AirDrop 过来也不给选这个 App，只能进 App 里手动点导入。
    #
    # CFBundleDisplayName 不写在这里 —— iOS 侧走的是 INFOPLIST_KEY_ 那条路
    # （见下面 settings），两处都写等于同一个键有两个来源。
    info:
      path: PendingNetIOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: PendingNet Pairing
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.pendingname.pdn
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.pendingname.pdn
            UTTypeDescription: PendingNet Pairing
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - pdn
              public.mime-type: application/vnd.pendingnet.pairing+json
        # 故意**不**支持就地打开：这样系统会把文件拷一份进 App 的 Inbox，
        # 我们读完就把那份拷贝删掉（见 PendingNetIOSApp 的 onOpenURL）。
        # 就地打开意味着去碰用户 iCloud 云盘里的原件，而我们对这个文件只有
        # 「读一次」这一个诉求，拿不到删除它的正当理由。
        LSSupportsOpeningDocumentsInPlace: false
    entitlements:
      path: PendingNetIOS/PendingNetIOS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.pendingname.pendingnet
        # 已配对 VPS 与设备令牌在 Mac 与 iPhone 之间同步：键值存储标识和
        # 钥匙串共享组两端必须**逐字相同**。两端的 bundle id 现在都是
        # com.pendingname.pendingnet（2026-08-08 把 macOS 从 net.pending.PendingNet
        # 归一过来），仍然写字面量而不是 $(CFBundleIdentifier)：这两个值是
        # 「共享组的名字」，哪天某一端的 bundle id 再变，也不该跟着变——跟着变
        # 就等于换了一把钥匙，两端立刻互相读不到。
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.pendingname.pendingnet
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.pendingname.pendingnet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingnet
        PRODUCT_NAME: PendingNet
        DEVELOPMENT_TEAM: M42BKJN82S
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: PendingNet
        ASSETCATALOG_COMPILER_APPICON_NAME: PendingNet
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: SBTallyCore
        product: SBTallyCore
      - target: PendingNetPacketTunnel
        embed: true
      # 主 App 也要链接 Libbox：协议手选与测速走 libbox command client
      # 连扩展里的 command server（不重启隧道），客户端代码跑在 App 进程里。
      - framework: Vendor/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: UIKit.framework
    postBuildScripts:
      - name: Verify bundled version
        script: |
          INFO_PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          actual_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST")
          actual_build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST")
          if [ "$actual_version" != "$MARKETING_VERSION" ] || [ "$actual_build" != "$CURRENT_PROJECT_VERSION" ]; then
            echo "error: bundled version $actual_version ($actual_build) does not match build settings $MARKETING_VERSION ($CURRENT_PROJECT_VERSION)" >&2
            exit 1
          fi
  PendingNetHelper:
    type: tool
    platform: macOS
    sources:
      - path: PendingNetHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingnet.helper
        PRODUCT_NAME: PendingNetHelper
    dependencies:
      - package: SBTallyCore
        product: SBTallyCore
  PendingNet:
    type: application
    platform: macOS
    sources:
      - path: SBTally
      - path: PendingUI
      - path: PendingNetHelper/HelperProtocol.swift
      - path: PendingNet.icon
    # 与 iOS 端逐字相同的两把钥匙 —— 已配对 VPS 走 iCloud 键值存储，设备令牌
    # 走共享钥匙串组。注意：这两项是「受限 entitlement」，必须由描述文件背书，
    # 光靠 codesign 签进去不算数（见 scripts/sign-macos-development.sh）。
    # 本地 ad-hoc 构建两项都不生效，App 自动退回纯本地存储。
    entitlements:
      path: SBTally/PendingNet.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.pendingname.pendingnet
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.pendingname.pendingnet
    info:
      path: SBTally/Info.plist
      properties:
        CFBundleDisplayName: PendingNet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: PendingNet Pairing
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.pendingname.pdn
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.pendingname.pdn
            UTTypeDescription: PendingNet Pairing
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - pdn
              public.mime-type: application/vnd.pendingnet.pairing+json
        SUFeedURL: $(PENDINGNET_UPDATE_FEED_URL)
        SUPublicEDKey: iVYT89UTxhljv5zkk6Si7C1TFOZJPUFmb/ysQufwHGY=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableSystemProfiling: false
    settings:
      base:
        # 和 iOS target 逐字相同 —— 苹果的 App ID 本来就是跨平台的一份，两端同
        # 一个 id 才能不写死地共用 iCloud 键值存储与钥匙串组。2026-08-08 从
        # net.pending.PendingNet 改过来，迁移事项见 docs/macos-updates.md。
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingnet
        PRODUCT_NAME: PendingNet
        # 分层 .icon（Icon Composer）：macOS 26 由系统上圆角/高光/投影，
        # actool 顺带产出传统 .icns 兜底老系统。见 scripts/make-app-icon.py。
        ASSETCATALOG_COMPILER_APPICON_NAME: PendingNet
        MARKETING_VERSION: 0.3.21
        CURRENT_PROJECT_VERSION: 321
        PENDINGNET_UPDATE_FEED_URL: https://updates.pendingname.com/pendingnet/appcast.xml
        # 发布仍是 Developer ID + 手工 codesign（构建时 CODE_SIGNING_ALLOWED=NO），
        # 这里补 team 是为了能在门户/Xcode 侧给这个 App ID 配 iCloud 与钥匙串共享。
        DEVELOPMENT_TEAM: M42BKJN82S
        # 这个 target 从来不由 Xcode 签名 —— 构建完一律交给
        # scripts/sign-macos-development.sh（本地 ad-hoc / 发布 Developer ID +
        # 描述文件）。不显式关掉的话，自从 app 带上 iCloud 与钥匙串共享
        # entitlement，自动签名会去找一份含 iCloud 能力的 Mac 描述文件，
        # README 里那条最普通的 `xcodebuild ... -scheme PendingNet build`
        # 就直接失败——而发布路径因为一直显式传 CODE_SIGNING_ALLOWED=NO，
        # 反而看不出问题。
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - package: SBTallyCore
        product: SBTallyCore
      - package: Sparkle
        product: Sparkle
      - target: PendingNetHelper
        embed: false
    postBuildScripts:
      - name: Embed helper + daemon plist
        script: |
          APP="$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app"
          # 先清空再拷：这个目录是脚本自己堆出来的，增量构建不会替我们删东西。
          # bundle id 改名那次就撞上了 —— 旧的 net.pending.* plist 还躺在里面，
          # 一个 app 包里出现两个后台服务声明。
          rm -rf "$APP/Contents/Library/LaunchDaemons"
          mkdir -p "$APP/Contents/Library/LaunchDaemons" "$APP/Contents/MacOS"
          cp "$BUILT_PRODUCTS_DIR/PendingNetHelper" "$APP/Contents/MacOS/"
          cp "$SRCROOT/PendingNetHelper/com.pendingname.pendingnet.helper.plist" "$APP/Contents/Library/LaunchDaemons/"
