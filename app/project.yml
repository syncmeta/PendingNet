name: PendingNet
options:
  bundleIdPrefix: net.pending
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 全端共用的版本号。macOS target 下面还会再写一遍同样的值 —— 发布脚本
    # 取的是 MARKETING_VERSION 的最后一次出现，两处要一起改。
    MARKETING_VERSION: "0.3.18"
    CURRENT_PROJECT_VERSION: "318"
    GENERATE_INFOPLIST_FILE: "YES"
packages:
  SBTallyCore:
    path: SBTallyCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2
targets:
  PendingNetPacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: PendingNet Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PendingNetPacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.pendingname.pendingnet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingnet.extension
        PRODUCT_NAME: PendingNetPacketTunnel
        # 仅 iOS target 使用自动签名；macOS 侧沿用既有的 Developer ID + 公证流程，不受影响。
        DEVELOPMENT_TEAM: M42BKJN82S
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SBTallyCore
        product: SBTallyCore
      - framework: Vendor/Libbox.xcframework
        embed: false
      # Libbox 是静态库，它自己的依赖要由宿主 target 补齐：
      # Go 运行时的 cgo resolver 引用 res_9_ninit/nclose/nsearch（libresolv），
      # 内嵌的 base::ios::ScopedCriticalAction 引用 UIApplication（UIKit）。
      - sdk: libresolv.tbd
      - sdk: UIKit.framework
  PendingNetIOS:
    type: application
    platform: iOS
    sources:
      - path: PendingNetIOS
      - path: PendingUI
      # 与 macOS 共用同一份分层图标（见 scripts/make-app-icon.py）
      - path: PendingNet.icon
    entitlements:
      path: PendingNetIOS/PendingNetIOS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.pendingname.pendingnet
        # 已配对 VPS 与设备令牌在 Mac 与 iPhone 之间同步：键值存储标识和
        # 钥匙串共享组两端必须**逐字相同**（macOS 那个 target 的 bundle id 是
        # net.pending.PendingNet，所以这里写死 com.pendingname.pendingnet，
        # 不能用 $(CFBundleIdentifier)）。
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.pendingname.pendingnet
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.pendingname.pendingnet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingnet
        PRODUCT_NAME: PendingNet
        DEVELOPMENT_TEAM: M42BKJN82S
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: PendingNet
        ASSETCATALOG_COMPILER_APPICON_NAME: PendingNet
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: SBTallyCore
        product: SBTallyCore
      - target: PendingNetPacketTunnel
        embed: true
      # 主 App 也要链接 Libbox：协议手选与测速走 libbox command client
      # 连扩展里的 command server（不重启隧道），客户端代码跑在 App 进程里。
      - framework: Vendor/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: UIKit.framework
  PendingNetHelper:
    type: tool
    platform: macOS
    sources:
      - path: PendingNetHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.pending.PendingNet.helper
        PRODUCT_NAME: PendingNetHelper
    dependencies:
      - package: SBTallyCore
        product: SBTallyCore
  PendingNet:
    type: application
    platform: macOS
    sources:
      - path: SBTally
      - path: PendingUI
      - path: PendingNetHelper/HelperProtocol.swift
      - path: PendingNet.icon
    # 与 iOS 端逐字相同的两把钥匙 —— 已配对 VPS 走 iCloud 键值存储，设备令牌
    # 走共享钥匙串组。注意：这两项是「受限 entitlement」，必须由描述文件背书，
    # 光靠 codesign 签进去不算数（见 scripts/sign-macos-development.sh）。
    # 本地 ad-hoc 构建两项都不生效，App 自动退回纯本地存储。
    entitlements:
      path: SBTally/PendingNet.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.pendingname.pendingnet
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.pendingname.pendingnet
    info:
      path: SBTally/Info.plist
      properties:
        CFBundleDisplayName: PendingNet
        CFBundleDocumentTypes:
          - CFBundleTypeName: PendingNet Pairing
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - net.pending.pdn
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.pending.pdn
            UTTypeDescription: PendingNet Pairing
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - pdn
              public.mime-type: application/vnd.pendingnet.pairing+json
        SUFeedURL: $(PENDINGNET_UPDATE_FEED_URL)
        SUPublicEDKey: iVYT89UTxhljv5zkk6Si7C1TFOZJPUFmb/ysQufwHGY=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableSystemProfiling: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.pending.PendingNet
        PRODUCT_NAME: PendingNet
        # 分层 .icon（Icon Composer）：macOS 26 由系统上圆角/高光/投影，
        # actool 顺带产出传统 .icns 兜底老系统。见 scripts/make-app-icon.py。
        ASSETCATALOG_COMPILER_APPICON_NAME: PendingNet
        MARKETING_VERSION: 0.3.18
        CURRENT_PROJECT_VERSION: 318
        PENDINGNET_UPDATE_FEED_URL: https://updates.pendingname.com/pendingnet/appcast.xml
        # 发布仍是 Developer ID + 手工 codesign（构建时 CODE_SIGNING_ALLOWED=NO），
        # 这里补 team 是为了能在门户/Xcode 侧给这个 App ID 配 iCloud 与钥匙串共享。
        DEVELOPMENT_TEAM: M42BKJN82S
    dependencies:
      - package: SBTallyCore
        product: SBTallyCore
      - package: Sparkle
        product: Sparkle
      - target: PendingNetHelper
        embed: false
    postBuildScripts:
      - name: Embed helper + daemon plist
        script: |
          APP="$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app"
          mkdir -p "$APP/Contents/Library/LaunchDaemons" "$APP/Contents/MacOS"
          cp "$BUILT_PRODUCTS_DIR/PendingNetHelper" "$APP/Contents/MacOS/"
          cp "$SRCROOT/PendingNetHelper/net.pending.PendingNet.helper.plist" "$APP/Contents/Library/LaunchDaemons/"
