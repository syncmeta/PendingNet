name: SBTally
options:
  bundleIdPrefix: dev.sbtally
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "YES"
    PRODUCT_NAME: SBTally
packages:
  SBTallyCore:
    path: SBTallyCore
targets:
  SBTally:
    type: application
    platform: macOS
    sources:
      - path: SBTally
    dependencies:
      - package: SBTallyCore
        product: SBTallyCore
